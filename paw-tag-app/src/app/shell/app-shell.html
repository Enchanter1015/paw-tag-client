<div class="pt-shell">
  <header class="pt-topbar">
    <span class="pt-topbar-title">PawTag</span>
    @if (authState.isAuthenticated()) {
      <button type="button" class="pt-btn pt-btn-ghost" (click)="logout()">Sign out</button>
    }
  </header>

  <nav class="pt-nav" aria-label="Primary">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/animals" routerLinkActive="is-active">Animals</a>
    <a routerLink="/scan" routerLinkActive="is-active">Scan</a>
    @if (!authState.isGuest()) {
      <a routerLink="/records" routerLinkActive="is-active">Records</a>
      <a routerLink="/profile" routerLinkActive="is-active">Profile</a>
    }
  </nav>

  @if (authState.isAdministrator()) {
    <nav class="pt-admin-nav" aria-label="Administrator">
      <span class="pt-admin-nav-title">Admin</span>
      <a routerLink="/admin/users" routerLinkActive="is-active">User management</a>
      <a routerLink="/admin/verification" routerLinkActive="is-active">Record verification</a>
    </nav>
  }

  <main class="pt-content">
    <router-outlet />
  </main>
</div>
