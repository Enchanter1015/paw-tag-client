    <svg class="pt-offline-banner-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" />
      <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="12" cy="19" r="1" fill="currentColor" />

  </div>
}
