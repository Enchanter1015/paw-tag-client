<div class="auth-screen">
  <a routerLink="/" class="auth-back-link" aria-label="Back to home">
    <svg class="auth-back-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path
        fill-rule="evenodd"
        d="M17 10a.75.75 0 0 1-.75.75H5.612l4.158 3.96a.75.75 0 1 1-1.04 1.08l-5.5-5.25a.75.75 0 0 1 0-1.08l5.5-5.25a.75.75 0 1 1 1.04 1.08L5.612 9.25H16.25A.75.75 0 0 1 17 10Z"
        clip-rule="evenodd"
      />
    </svg>
    <span>Back to home</span>
  </a>

  <div class="auth-header">
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Register to record and track animal health.</p>
  </div>

  <pt-card>
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <pt-input
        label="Name"
        autocomplete="name"
        formControlName="name"
        [error]="nameError()"
      ></pt-input>

      <pt-input
        label="Email"
        type="email"
        autocomplete="email"
        formControlName="email"
        [error]="emailError()"
      ></pt-input>

      <pt-input
        label="Password"
        type="password"
        autocomplete="new-password"
        formControlName="password"
        [error]="passwordError()"
      ></pt-input>

      @if (formError()) {
        <p class="auth-form-error">{{ formError() }}</p>
      }

      <pt-button type="submit" [full]="true" [disabled]="submitting()">
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </pt-button>
    </form>
  </pt-card>

  <p class="auth-switch">
    Already have an account? <a routerLink="/login">Sign in</a>
  </p>
</div>
